<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Logo ASD-STF100">
  <defs>
    <linearGradient id="stfBg" x1="6" y1="6" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>

    <radialGradient id="stfGlow" cx="60" cy="54" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#090d1a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stfBorder" x1="8" y1="6" x2="112" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="stfRing" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="stfPage" x1="34" y1="28" x2="86" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="stfCheck" x1="48" y1="64" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Outer indigo-obsidian squircle -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#stfBg)"/>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#stfGlow)"/>
  <rect x="4" y="4" width="112" height="112" rx="26" stroke="url(#stfBorder)" stroke-width="1.6"/>

  <!-- Diataxis 4-quadrant calibration frame -->
  <circle cx="60" cy="60" r="41" stroke="url(#stfRing)" stroke-width="2.2" stroke-opacity="0.42" stroke-dasharray="18 6"/>
  <line x1="60" y1="13" x2="60" y2="21" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="60" y1="99" x2="60" y2="107" stroke="#818cf8" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="13" y1="60" x2="21" y2="60" stroke="#818cf8" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="99" y1="60" x2="107" y2="60" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Controlled specification sheet -->
  <path d="M 36 28 H 68 L 84 44 V 88 C 84 91.3 81.3 94 78 94 H 36 C 32.7 94 30 91.3 30 88 V 34 C 30 30.7 32.7 28 36 28 Z"
        fill="url(#stfPage)"
        stroke="#818cf8"
        stroke-width="2"/>
  <path d="M 68 28 V 41 C 68 42.7 69.3 44 71 44 H 84"
        fill="#1e1b4b"
        stroke="#22d3ee"
        stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Short controlled-prose lines (<= 20 words precision motif) -->
  <line x1="40" y1="49" x2="62" y2="49" stroke="#e0e7ff" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="40" y1="59" x2="72" y2="59" stroke="#94a3b8" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="40" y1="69" x2="58" y2="69" stroke="#64748b" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Cyan validation badge & checkmark -->
  <circle cx="72" cy="78" r="14" fill="#090d1a" stroke="#22d3ee" stroke-width="2.2"/>
  <path d="M 65.5 78.2 L 70.0 82.6 L 78.8 73.2"
        stroke="url(#stfCheck)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
