site_name: ASD-STF100 — Français Technique Simplifié
site_description: Norme ouverte de rédaction technique contrôlée, linter STF, architecture Diátaxis FR et chaîne Docs-as-Code
repo_url: https://github.com/jmrenouard/asd-stf100
docs_dir: docs

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Accueil: index.md
  - Tutoriels:
      - 01-tutoriels/index.md
      - Démarrage rapide ASD-STF100: 01-tutoriels/01-demarrage-rapide-stf100.md
      - Initialiser une documentation Diátaxis FR: 01-tutoriels/02-initialiser-doc-diataxis-fr.md
  - Guides pratiques:
      - 02-guides-pratiques/index.md
      - Rédiger une procédure en ASD-STF100: 02-guides-pratiques/rediger-procedure-stf100.md
      - Rédiger une consigne de sécurité: 02-guides-pratiques/rediger-consigne-securite.md
      - Migrer une documentation vers Diátaxis: 02-guides-pratiques/migrer-documentation-diataxis.md
      - Configurer la CI Docs-as-Code: 02-guides-pratiques/configurer-ci-docs-as-code.md
      - Générer le PDF de spécification: 02-guides-pratiques/generer-pdf-specification.md
  - Référence:
      - 03-reference/index.md
      - Règles de rédaction (53 règles + GR): 03-reference/regles-redaction.md
      - Dictionnaire contrôlé STF-100: 03-reference/dictionnaire-stf.md
      - Catégories techniques (22 noms + 4 verbes): 03-reference/categories-techniques.md
      - Matrice Diátaxis (FR): 03-reference/matrice-diataxis-fr.md
      - Commandes CLI et codes retour: 03-reference/cli-et-codes-retour.md
  - Explications:
      - 04-explications/index.md
      - Principes fondamentaux d'ASD-STF100: 04-explications/principes-asd-stf100.md
      - Méthodologie Diátaxis et Docs-as-Code: 04-explications/methodologie-diataxis-et-docs-as-code.md
      - ADR-001 — Adaptation française d'ASD-STE100: 04-explications/adr-001-adaptation-francaise.md
